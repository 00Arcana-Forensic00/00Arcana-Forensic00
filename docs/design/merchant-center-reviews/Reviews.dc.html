<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product reviews</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'DM Sans',sans-serif;background:#F6F3EC;color:#1B1F1D}
a{color:#1F6F5C}a:hover{color:#14493c}
</style>
</helmet>
<div style="width: 1280px; height: 860px; box-sizing: border-box; display: flex; background: #F6F3EC; font-family: 'DM Sans', sans-serif; color: #1B1F1D">
<div style="width: 232px; flex-shrink: 0; box-sizing: border-box; padding: 28px 20px; background: #1B1F1D; color: #F6F3EC; display: flex; flex-direction: column; gap: 32px">
<div style="font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600">[Store name]</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="Main.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #D9D5C9; text-decoration: none; font-size: 15px">Overview</a>
<a href="Main.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #D9D5C9; text-decoration: none; font-size: 15px">Products</a>
<a href="Main.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #D9D5C9; text-decoration: none; font-size: 15px">Feeds</a>
<a href="Reviews.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600">Reviews</a>
<a href="Main.dc.html" style="display: block; padding: 12px 14px; border-radius: 8px; color: #D9D5C9; text-decoration: none; font-size: 15px">Settings</a>
</div>
</div>
<div style="flex-grow: 1; box-sizing: border-box; padding: 36px 44px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; color: #5A615D">Product ratings and seller reviews</div>
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 40px; font-weight: 500">Reviews</h1>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px">
<div style="background: #ffffff; border: 1px solid #DDD8CA; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; color: #5A615D">Average rating</div>
<div style="font-family: 'Fraunces', serif; font-size: 56px; font-weight: 500">[0.0]</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 16.5,14 18.5,21.5 12,17.5 5.5,21.5 7.5,14 2,9.5 9,9" fill="{{accent}}"></polygon></svg>
</sc-for>
</div>
<div style="font-size: 14px; color: #5A615D">Based on [000] reviews</div>
</div>
<div style="background: #ffffff; border: 1px solid #DDD8CA; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 18px; font-weight: 600">Rating breakdown</div>
<sc-for list="{{dist}}" as="d" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 56px; font-size: 14px">{{d.label}}</div>
<div style="flex-grow: 1; height: 12px; background: #ECE8DC; border-radius: 6px"><div style="height: 12px; border-radius: 6px; background: {{accent}}; width: {{d.w}}"></div></div>
<div style="width: 56px; text-align: right; font-size: 14px; color: #5A615D">[00]</div>
</div>
</sc-for>
</div>
</div>
<div style="background: #ffffff; border: 1px solid #DDD8CA; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<div style="font-size: 18px; font-weight: 600; padding-bottom: 10px">Recent reviews</div>
<sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
<div style="padding: 16px 0; border-top: 1px solid #ECE8DC; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between">
<div style="font-size: 16px; font-weight: 600">{{r.product}}</div>
<div style="font-size: 14px; color: #5A615D">{{r.rating}} · [Date]</div>
</div>
<div style="font-size: 15px; color: #3A403C">{{r.text}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F6F5C"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return {
stars: [1, 2, 3, 4, 5],
dist: [
{ label: '5 stars', w: '70%' },
{ label: '4 stars', w: '40%' },
{ label: '3 stars', w: '20%' },
{ label: '2 stars', w: '10%' },
{ label: '1 star', w: '6%' }
],
reviews: [
{ product: '[Product name 1]', rating: '[0] of 5', text: '[Review text goes here.]' },
{ product: '[Product name 2]', rating: '[0] of 5', text: '[Review text goes here.]' },
{ product: '[Product name 3]', rating: '[0] of 5', text: '[Review text goes here.]' }
],
accent: this.props.accent ?? '#1F6F5C'
};
}
}
</script>
</body>
</html>
