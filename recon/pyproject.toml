[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arcana-recon"
version = "0.1.0"
description = "Classical document-image repair (illumination flattening, clipped-region inpainting, XY-cut reading order) sealed into ARCN v1 vault blobs."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "opencv-python-headless>=4.6",
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
arcana-recon = "arcana_recon.cli:main"

[tool.setuptools]
packages = ["arcana_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
