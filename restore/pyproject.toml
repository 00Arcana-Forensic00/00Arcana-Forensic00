[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcana-restore"
version = "0.1.0"
description = "Forensic document restoration: glare/shadow repair, reading-order mapping, passphrase-sealed vaults and a hash-chained custody ledger."
requires-python = ">=3.10"
license = { text = "Commercial - see LICENSE at repository root" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "cryptography>=44.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
arcana-restore = "arcana_restore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
