name: restore-release
# Manual run: builds installers and uploads them as workflow artifacts.
# Tag `restore-vX.Y.Z`: also publishes a GitHub Release with checksums.
on:
  workflow_dispatch:
  push:
    tags: ["restore-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # a hung job must fail in minutes, not burn the 6-hour default
    defaults:
      run:
        shell: bash
    env:
      # Booleans only: the secret VALUES are attached to the individual signing steps below,
      # so third-party packages installed during test/build never see them.
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' restore/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Linux deps (Tk, Xvfb, WebKitGTK for the app window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-webkit2-4.1
          # PyGObject 3.52+ needs girepository-2.0 (not in ubuntu-latest); 3.50 builds against 1.0.
          pip install 'PyGObject<3.51' 'pywebview[gtk]'
      - name: Install package
        timeout-minutes: 15
        run: pip install --progress-bar off -e './restore[test,gui,app]' pytest-timeout
      - name: Collect tests
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pytest restore --collect-only -q; else pytest restore --collect-only -q; fi
      - name: Test
        timeout-minutes: 15
        run: |
          # -v names every test as it starts; --timeout fails a hung test; faulthandler_timeout dumps all
          # thread stacks if something stalls outside a test (e.g. a native GUI call).
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pytest restore -v --timeout=180 --timeout-method=thread -o faulthandler_timeout=90; else pytest restore -v --timeout=180 --timeout-method=thread -o faulthandler_timeout=90; fi
      - name: Build executables (direct edition)
        run: python restore/packaging/build.py
      - name: Smoke test command-line executable
        run: python restore/packaging/smoke.py "restore/dist/arcana-restore$([ "$RUNNER_OS" = Windows ] && echo .exe)"
      - name: Smoke test app window
        # Opens the real window, waits for the page to reach the back end, closes it.
        continue-on-error: ${{ runner.os == 'Linux' }}   # WebKitGTK bundling is not yet proven
        run: |
          case "$RUNNER_OS" in
            Windows) restore/dist/Arcalume/Arcalume.exe --smoke ;;
            macOS)   restore/dist/Arcalume.app/Contents/MacOS/Arcalume --smoke ;;
            Linux)   xvfb-run -a restore/dist/Arcalume --smoke ;;
          esac

      # ---- Linux: tar.gz with installer script
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          d="restore/dist/Arcalume-${VERSION}-linux"
          mkdir -p "$d"
          cp restore/dist/Arcalume restore/dist/arcana-restore restore/packaging/icons/icon.png restore/packaging/linux/install.sh "$d/"
          tar -C restore/dist -czf "${d}.tar.gz" "$(basename "$d")"
          rm -rf "$d"
          cp restore/dist/arcana-restore restore/dist/arcana-restore-linux

      # ---- Windows: sign exes, build Inno Setup installer, sign it
      - name: Windows signing setup
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: echo "$WIN_CERT_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
      - name: Sign Windows executables
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          foreach ($f in "restore\dist\Arcalume\Arcalume.exe","restore\dist\arcana-restore.exe") {
            & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f }
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" restore\packaging\windows\arcalume.iss
          Copy-Item restore\dist\arcana-restore.exe restore\dist\arcana-restore-windows.exe
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "restore\dist\Arcalume-Setup-$env:VERSION.exe"
      - name: Microsoft Store package (store edition, unsigned; the Store signs it)
        if: runner.os == 'Windows' && vars.MSIX_IDENTITY_NAME != ''
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          python restore/packaging/build.py --edition store --skip-install
          python restore/packaging/windows/msix/build_msix.py --version "${VERSION}.0"

      # ---- macOS: .app in a .dmg (sign + notarize when secrets exist)
      - name: macOS app and dmg
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd restore/dist
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
            codesign --deep --force --options runtime --timestamp --entitlements ../packaging/macos/entitlements.plist --sign "$APPLE_SIGN_IDENTITY" "Arcalume.app"
          fi
          mkdir dmgroot && cp -R "Arcalume.app" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Arcalume" -srcfolder dmgroot -ov -format UDZO "Arcalume-${VERSION}-macos.dmg"
          rm -rf dmgroot
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            xcrun notarytool submit "Arcalume-${VERSION}-macos.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "Arcalume-${VERSION}-macos.dmg"
          fi
          cp arcana-restore arcana-restore-macos

      - name: Collect release files
        run: |
          mkdir -p out
          cd restore/dist
          for f in Arcalume-*.tar.gz Arcalume-Setup-*.exe Arcalume-*-macos.dmg Arcalume-*-store.msix arcana-restore-linux arcana-restore-macos arcana-restore-windows.exe; do
            [ -f "$f" ] && cp "$f" ../../out/ || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-restore-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/restore-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" * --repo "${GITHUB_REPOSITORY}" --title "Arcalume ${GITHUB_REF_NAME#restore-v}" \
            --notes "Arcalume installers for Windows, macOS and Linux. Verify downloads against SHA256SUMS. Unsigned builds show an OS warning on first launch. The .msix is for Microsoft Store submission only."
