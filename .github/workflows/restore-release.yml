name: restore-release
# Manual run: builds installers and uploads them as workflow artifacts.
# Tag `restore-vX.Y.Z`: also publishes a GitHub Release with checksums.
on:
  workflow_dispatch:
  push:
    tags: ["restore-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Booleans only: the secret VALUES are attached to the individual signing steps below,
      # so third-party packages installed during test/build never see them.
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' restore/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Linux deps (Tk, Xvfb)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Test
        run: |
          pip install -e './restore[test,gui]'
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pytest restore -q; else pytest restore -q; fi
      - name: Build executables
        run: python restore/packaging/build.py
      - name: Smoke test command-line executable
        run: python restore/packaging/smoke.py "restore/dist/arcana-restore$([ "$RUNNER_OS" = Windows ] && echo .exe)"

      # ---- Linux: tar.gz with installer script
      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          d="restore/dist/ArcanaRestore-${VERSION}-linux"
          mkdir -p "$d"
          cp restore/dist/ArcanaRestore restore/dist/arcana-restore restore/packaging/icons/icon.png restore/packaging/linux/install.sh "$d/"
          tar -C restore/dist -czf "${d}.tar.gz" "$(basename "$d")"
          rm -rf "$d"
          cp restore/dist/arcana-restore restore/dist/arcana-restore-linux

      # ---- Windows: sign exes, build Inno Setup installer, sign it
      - name: Windows signing setup
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: echo "$WIN_CERT_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
      - name: Sign Windows executables
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          foreach ($f in "restore\dist\ArcanaRestore.exe","restore\dist\arcana-restore.exe") {
            & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f }
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" restore\packaging\windows\arcana-restore.iss
          Copy-Item restore\dist\arcana-restore.exe restore\dist\arcana-restore-windows.exe
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $st = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $st sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "restore\dist\ArcanaRestore-Setup-$env:VERSION.exe"

      # ---- macOS: .app in a .dmg (sign + notarize when secrets exist)
      - name: macOS app and dmg
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd restore/dist
          rm -rf "Arcana Restore.app" && mv ArcanaRestore.app "Arcana Restore.app"
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
            codesign --deep --force --options runtime --timestamp --sign "$APPLE_SIGN_IDENTITY" "Arcana Restore.app"
          fi
          mkdir dmgroot && cp -R "Arcana Restore.app" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Arcana Restore" -srcfolder dmgroot -ov -format UDZO "ArcanaRestore-${VERSION}-macos.dmg"
          rm -rf dmgroot
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            xcrun notarytool submit "ArcanaRestore-${VERSION}-macos.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "ArcanaRestore-${VERSION}-macos.dmg"
          fi
          cp arcana-restore arcana-restore-macos

      - name: Collect release files
        run: |
          mkdir -p out
          cd restore/dist
          for f in ArcanaRestore-*.tar.gz ArcanaRestore-Setup-*.exe ArcanaRestore-*-macos.dmg arcana-restore-linux arcana-restore-macos arcana-restore-windows.exe; do
            [ -f "$f" ] && cp "$f" ../../out/ || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-restore-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/restore-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" * --repo "${GITHUB_REPOSITORY}" --title "Arcana Restore ${GITHUB_REF_NAME#restore-v}" \
            --notes "Installers for Windows, macOS and Linux. Verify downloads against SHA256SUMS. Unsigned builds show an OS warning on first launch."
