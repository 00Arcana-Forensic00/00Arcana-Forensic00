name: restore
on:
  push:
    paths: ["restore/**", "license-worker/**", ".github/workflows/restore.yml"]
  pull_request:
    paths: ["restore/**", "license-worker/**", ".github/workflows/restore.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -e './restore[test,gui,ui-test]' axe-playwright-python
      - run: python -m playwright install --with-deps chromium
      # Engine, vaults, ledger, licensing, app back end, and the UI + WCAG 2.2 AA audit in Chromium.
      - run: xvfb-run -a pytest restore -q -rs
      - name: License worker
        working-directory: license-worker
        run: npm test
