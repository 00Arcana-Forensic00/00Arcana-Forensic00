name: macos-diag
on:
  push:
    branches: ["claude/macos-diag-*"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --progress-bar off -e './restore[test,gui,app]'
      - name: Build
        run: python restore/packaging/build.py
      - name: Smoke the app window (verbose)
        run: restore/dist/Arcalume.app/Contents/MacOS/Arcalume --smoke
