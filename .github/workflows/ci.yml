name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Test workspace
        run: cargo test --workspace
      - name: Build acquire CLI
        run: cargo build -p arcana-acquire

  recon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install arcana-recon
        run: pip install -e '.[test]'
      - name: Test arcana-recon
        run: pytest -q
