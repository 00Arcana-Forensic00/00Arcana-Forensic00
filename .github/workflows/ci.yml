name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Generate lockfile for Cargo 1.75
        run: cargo generate-lockfile
      - name: Test workspace
        run: cargo test --workspace
      - name: Build acquire CLI
        run: cargo build -p arcana-acquire
