[workspace]
members = [
    "arcana-core",
    "arcana-vault", 
    "arcana-acquire",
    "arcana-custody",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
arcana-core = { path = "arcana-core" }
aes-gcm = "0.10"
sha2 = "0.10"
thiserror = "1.0"
argon2 = "0.5"
rand_core = "0.6"
rand = "0.8"
