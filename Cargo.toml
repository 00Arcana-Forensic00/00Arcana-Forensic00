[workspace]
members = [
    "crates/arcana-core",
    "crates/arcana-vault", 
    "crates/arcana-custody",
    "crates/arcana-acquire",
    "crates/arcana-sanitize",      # NEW: Core sanitization
    "crates/arcana-scif",          # NEW: NASA-grade physical (Enterprise)
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
arcana-core = { path = "crates/arcana-core" }
aes-gcm = "0.10"
sha2 = "0.10"
thiserror = "1.0"
argon2 = "0.5"
rand_core = "0.6"
rand = "0.8"
