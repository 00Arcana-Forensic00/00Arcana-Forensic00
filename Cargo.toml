[workspace]
members = [
    "crates/arcana-core",
    "crates/arcana-vault",
    "crates/arcana-custody",
    "crates/arcana-acquire",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Arcana-Forensics"]
repository = "https://github.com/mitchell5584dm-tech/00Arcana-Forensic00"
description = "Air-gapped filesystem acquisition, AES-256-GCM vault sealing, and hash-chained custody ledger."
rust-version = "1.75"

[workspace.dependencies]
aes-gcm = "=0.10.3"
sha2 = "=0.10.8"
thiserror = "=1.0.63"
rand = "=0.8.5"
rand_core = "=0.6.4"
zeroize = { version = "=1.6.0", default-features = false }
hex = "0.4.3"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
clap = { version = "=4.4.18", features = ["derive", "env"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
walkdir = "=2.5.0"
