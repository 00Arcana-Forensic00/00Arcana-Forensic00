[package]
name = "arcana-sanitize"
version = "0.1.0"

[features]
default = ["software-checks"]
software-checks = []  # RAM scrub, process isolation (always available)
hardware-checks = ["serde", "yaml"]  # NASA VAB protocol (optional)
nasa-compliance = ["hardware-checks"]  # Strict mode

[dependencies]
serde = { version = "1.0", optional = true }
yaml = { version = "0.3", optional = true }
arcana-core = { path = "../arcana-core" }
